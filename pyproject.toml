[project]
name = "pharma-resilience-tr"
version = "0.1.0"
description = "Robust pharmaceutical supply resilience under partial topology observability"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
